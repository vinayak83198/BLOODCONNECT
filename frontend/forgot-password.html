
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot password — BloodConnect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="shell shell--narrow">
    <section class="card card--pad security-card">
      <a href="index.html">← Back to login</a>

      <h1>Forgot your password?</h1>

      <p>
        Enter the email address associated with your BloodConnect account.
        If an account exists, we'll email you a secure reset link.
      </p>

      <div id="notice" class="banner" role="status" aria-live="polite"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <button
          class="btn btn--primary btn--block"
          id="submit"
          type="submit"
        >
          Send reset link
        </button>
      </form>
    </section>
  </main>

  <!-- Production FastAPI backend on Render -->
  <script>
    window.BLOODCONNECT_API_BASE_URL =
      "https://bloodconnect-kfks.onrender.com";
  </script>

  <script src="js/api.js"></script>

  <script>
    (() => {
      const { api, ApiError } = window.BloodConnect;

      const form = document.getElementById("forgot-form");
      const emailInput = document.getElementById("email");
      const button = document.getElementById("submit");
      const notice = document.getElementById("notice");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.reportValidity()) return;

        const email = emailInput.value.trim();

        if (!email) {
          notice.textContent = "Please enter your email address.";
          notice.className = "banner is-visible banner--error";
          return;
        }

        button.disabled = true;
        button.textContent = "Sending...";
        notice.textContent = "";
        notice.className = "banner";

        try {
          const result = await api.forgotPassword(email);

          notice.textContent =
            result?.message ||
            "If an account exists, a password reset link will be sent to your email.";

          notice.className = "banner is-visible banner--success";
        } catch (error) {
          notice.textContent =
            error instanceof ApiError
              ? error.message
              : "Could not send the reset link. Please try again.";

          notice.className = "banner is-visible banner--error";
        } finally {
          button.disabled = false;
          button.textContent = "Send reset link";
        }
      });
    })();
  </script>
</body>
</html>
