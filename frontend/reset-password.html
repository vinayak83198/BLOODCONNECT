
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — BloodConnect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="shell shell--narrow">
    <section class="card card--pad security-card">
      <a href="index.html">← Back to login</a>

      <h1>Choose a new password</h1>
      <p>
        Use at least 8 characters. Reset links expire after 30 minutes
        and can only be used once.
      </p>

      <div id="notice" class="banner" role="status" aria-live="polite"></div>

      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input
            id="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          />
        </div>

        <button
          class="btn btn--primary btn--block"
          id="submit"
          type="submit"
        >
          Reset password
        </button>
      </form>

      <p><a href="forgot-password.html">Request another reset link</a></p>
    </section>
  </main>

  <!-- Use the deployed FastAPI backend -->
  <script>
    window.BLOODCONNECT_API_BASE_URL =
      "https://bloodconnect-kfks.onrender.com";
  </script>

  <script src="js/api.js"></script>

  <script>
    (() => {
      const { api, ApiError } = window.BloodConnect;

      const form = document.getElementById("reset-form");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm-password");
      const button = document.getElementById("submit");
      const notice = document.getElementById("notice");

      const token = new URLSearchParams(window.location.search).get("token");

      function showNotice(message, type) {
        notice.textContent = message;
        notice.className = `banner is-visible banner--${type}`;
      }

      if (!token) {
        showNotice(
          "This reset link is missing a token. Please request a new one.",
          "error"
        );
        button.disabled = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!token) return;

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 8) {
          showNotice("Password must be at least 8 characters.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showNotice("The passwords do not match.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Updating…";
        notice.textContent = "";
        notice.className = "banner";

        try {
          const result = await api.resetPassword(token, password);

          showNotice(
            result?.message || "Password changed successfully. You can now log in.",
            "success"
          );

          form.reset();

          const loginLink = document.createElement("a");
          loginLink.href = "index.html";
          loginLink.textContent = "Go to login";

          notice.appendChild(document.createTextNode(" "));
          notice.appendChild(loginLink);

          // A reset token can only be used once.
          button.disabled = true;
        } catch (error) {
          showNotice(
            error instanceof ApiError
              ? error.message
              : "Could not reset password. Please request a new link.",
            "error"
          );
        } finally {
          if (!button.disabled || notice.className.includes("banner--error")) {
            button.disabled = false;
          }
          button.textContent = "Reset password";
        }
      });
    })();
  </script>
</body>
</html>
