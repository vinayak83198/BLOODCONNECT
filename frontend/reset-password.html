<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — BloodConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="shell shell--narrow">
    <section class="card card--pad security-card">
      <a href="index.html">← Back to login</a>
      <h1>Choose a new password</h1>
      <p>Use at least 8 characters. Reset links expire after 30 minutes and can only be used once.</p>
      <div id="notice" class="banner" role="status"></div>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required />
        </div>
        <button class="btn btn--primary btn--block" id="submit" type="submit">Reset password</button>
      </form>
      <p><a href="forgot-password.html">Request another reset link</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script>
    const { api, ApiError } = window.BloodConnect;
    const form = document.getElementById("reset-form");
    const notice = document.getElementById("notice");
    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      notice.textContent = "This reset link is missing a token. Request a new one.";
      notice.className = "banner is-visible banner--error";
      form.querySelector("button").disabled = true;
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (password.length < 8 || password !== confirmPassword) {
        notice.textContent = password !== confirmPassword ? "The passwords do not match." : "Password must be at least 8 characters.";
        notice.className = "banner is-visible banner--error";
        return;
      }
      const button = document.getElementById("submit");
      button.disabled = true;
      button.textContent = "Updating…";
      try {
        const result = await api.resetPassword(token, password);
        notice.textContent = result.message + " ";
        notice.className = "banner is-visible banner--success";
        form.reset();
        const link = document.createElement("a");
        link.href = "index.html";
        link.textContent = "Go to login";
        notice.appendChild(link);
      } catch (error) {
        notice.textContent = error instanceof ApiError ? error.message : "Could not reset password. Request a new link.";
        notice.className = "banner is-visible banner--error";
      } finally {
        button.disabled = false;
        button.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
